[project]
name = "ai-career-concierge"
version = "0.1.0"
description = "AI Career Concierge backend and web boilerplate"
authors = [
    {name = "joon",email = "joonable2@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9.2"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "cryptography>=44.0.0,<46.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "langgraph>=0.3.0,<1.0.0",
    "langsmith>=0.4.37,<0.5.0",
    "playwright>=1.52.0,<2.0.0",
    "psycopg[binary]>=3.2.6,<4.0.0",
    "pyjwt>=2.10.0,<3.0.0",
    "pydantic-settings>=2.8.0,<3.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "sqlmodel>=0.0.22,<0.1.0",
    "uvicorn>=0.34.0,<1.0.0",
    "eval-type-backport (>=0.3.1,<0.4.0)",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0,<1.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "api", from = "src" },
    { include = "agent", from = "src" },
    { include = "common", from = "src" },
    { include = "db", from = "src" },
    { include = "scraper", from = "src" },
]

[tool.poetry.scripts]
dev = "api.dev:main"
eval-jobs = "agent.evals.runner:main"

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "UP006",  # non-pep585-annotation (List[x] → list[x], py39 runtime compat)
    "UP007",  # non-pep604-annotation (Union[x,y] → x|y, py39 runtime compat)
    "UP035",  # deprecated-import (typing.List etc, py39 compat)
    "UP045",  # non-pep604-annotation-optional (Optional[X] → X|None, py39 compat)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012"]  # mutable class defaults in test fakes are fine
"src/promptops/core/models.py" = ["E402"]  # module docstring before imports

[tool.ruff.lint.isort]
known-first-party = ["api", "agent", "common", "db", "scraper", "promptops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
